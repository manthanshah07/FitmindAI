services:
  - type: web
    name: fitmind-backend
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/pre_deploy.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
